name: Generate daily briefing

on:
  workflow_dispatch:
  schedule:
    # 06:10 Asia/Shanghai = 22:10 UTC (previous day)
    - cron: '10 22 * * *'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AI_PROVIDER: auto
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      QWEN_MODEL: ${{ vars.QWEN_MODEL || 'qwen3.5-27b' }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run briefing:generate
      - run: npm run build
      - name: Save the new briefing
        run: |
          if git diff --quiet -- public/data/briefings data/briefings; then
            echo "No briefing changes to commit."
            exit 0
          fi
          git config user.name "DailyNews Bot"
          git config user.email "dailynews-bot@users.noreply.github.com"
          git add public/data/briefings data/briefings
          git commit -m "chore: update daily briefing"
          git push
