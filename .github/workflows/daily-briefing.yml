name: Generate daily briefing

on:
  workflow_dispatch:
  schedule:
    # 07:30 Asia/Shanghai = 23:30 UTC (previous day)
    - cron: '30 23 * * *'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AI_PROVIDER: qwen
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      QWEN_MODEL: ${{ vars.QWEN_MODEL || 'qwen3.5-27b' }}
      QWEN_BASE_URL: ${{ secrets.QWEN_BASE_URL || 'https://dashscope.aliyuncs.com/compatible-mode/v1' }}
      NEWS_SEARCH_PROVIDER: tavily
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      DAILY_SEARCH_LIMIT: ${{ vars.DAILY_SEARCH_LIMIT || '32' }}
      DISCOVERY_QUERIES_PER_DOMAIN: ${{ vars.DISCOVERY_QUERIES_PER_DOMAIN || '6' }}
      SECOND_SOURCE_EVENT_LIMIT: ${{ vars.SECOND_SOURCE_EVENT_LIMIT || '8' }}
      ARTICLE_FETCH_LIMIT: ${{ vars.ARTICLE_FETCH_LIMIT || '30' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Resolve briefing date
        id: briefing-date
        run: echo "date=$(TZ=Asia/Shanghai date +%F)" >> "$GITHUB_OUTPUT"
      - name: Restore same-day search cache
        uses: actions/cache/restore@v5
        with:
          path: .cache/dailynews
          key: dailynews-search-${{ steps.briefing-date.outputs.date }}-${{ github.run_id }}
          restore-keys: |
            dailynews-search-${{ steps.briefing-date.outputs.date }}-
      - name: Generate briefing
        id: generate-briefing
        continue-on-error: true
        run: npm run briefing:generate
      - name: Save same-day search cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: .cache/dailynews
          key: dailynews-search-${{ steps.briefing-date.outputs.date }}-${{ github.run_id }}
      - name: Stop when generation failed
        if: steps.generate-briefing.outcome == 'failure'
        run: exit 1
      - run: npm run build
      - name: Save the new briefing
        run: |
          if git diff --quiet -- public/data/briefings data/briefings; then
            echo "No briefing changes to commit."
            exit 0
          fi
          git config user.name "DailyNews Bot"
          git config user.email "dailynews-bot@users.noreply.github.com"
          git add public/data/briefings data/briefings
          git commit -m "chore: update daily briefing"
          git push
